name: Promote

# Moves release up to develop (a pre build for testing) or main up to release (the release), in all
# repositories of amadeos/repositories.list or in the ones given (scripts/promote.sh). The pushes start the
# Build workflow on the moved branch; on main it tags vX.Y.Z and publishes the GitHub Release.
# Needs the secret PROMOTE_TOKEN: a fine-grained token of datazuul for the amadeOS repositories with
# Contents and Workflows read and write, stored in this repository (the built-in token may neither push to other repositories nor
# push commits that change workflow files, and its pushes would start no workflows).

on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Promote to'
        type: choice
        options: [release, main]
        required: true
      repos:
        description: 'Repositories (space-separated), empty for all'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Promote
        env:
          PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          TO: ${{ inputs.to }}
          REPOS: ${{ inputs.repos }}
        run: |
          test -n "$PROMOTE_TOKEN" || { echo "::error::The secret PROMOTE_TOKEN is missing"; exit 1; }
          # shellcheck disable=SC2086 # REPOS is a list
          scripts/promote.sh "$TO" $REPOS
